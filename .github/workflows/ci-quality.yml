name: ci-quality

# CI de calidad: typecheck (9 paquetes), tests del desktop, tests de la app,
# tests de core (4 paquetes), lint y changelog.
# Corre en cada push a dev, en pull requests y manualmente.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (9 paquetes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        shell: bash
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Typecheck schema
        working-directory: packages/schema
        run: bun run typecheck

      - name: Typecheck protocol
        working-directory: packages/protocol
        run: bun run typecheck

      - name: Typecheck core
        working-directory: packages/core
        run: bun run typecheck

      - name: Typecheck server
        working-directory: packages/server
        run: bun run typecheck

      - name: Typecheck client
        working-directory: packages/client
        run: bun run typecheck

      - name: Typecheck sdk-next
        working-directory: packages/sdk-next
        run: bun run typecheck

      - name: Typecheck opencode
        working-directory: packages/opencode
        run: bun run typecheck

      - name: Typecheck app
        working-directory: packages/app
        run: bun run typecheck

      - name: Typecheck desktop
        working-directory: packages/desktop
        run: bun run typecheck

  test-desktop:
    name: Tests desktop (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        shell: bash
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      # draft-store.test.ts se salta bajo bun (node:sqlite solo existe en Node/Electron,
      # el runtime de la app empaquetada). Runner Linux por consistencia con los demás jobs.
      - name: Run desktop unit tests
        working-directory: packages/desktop
        run: bun test

  test-app:
    name: Tests app (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        shell: bash
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      # Sin --only-failures: en CI siempre se ejecuta la suite completa.
      # El parity de i18n CORRE en CI desde #89: se quitó describe.skipIf(CI) para que
      # cualquier key nueva sin traducir rompa honestamente (fail rápido).
      - name: Run app unit tests
        working-directory: packages/app
        run: bun test --conditions=solid --preload ./happydom.ts ./src

  tests-core:
    name: Tests core (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Determine if core tests should run
        id: should-run
        shell: bash
        run: |
          # Default: no ejecutar (seguro ante fallos de git en PRs desde forks)
          echo "run=false" >> "$GITHUB_OUTPUT"
          # Siempre en push a dev o workflow_dispatch
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # En PR: solo si cambian paquetes core
          git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>/dev/null | grep -qE '^packages/(schema|protocol|core|server|client|sdk-next|opencode)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.should-run.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.should-run.outputs.run == 'true'
        shell: bash
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Test core
        if: steps.should-run.outputs.run == 'true'
        working-directory: packages/core
        run: bun test --timeout 30000 --only-failures

      - name: Test client
        if: steps.should-run.outputs.run == 'true'
        working-directory: packages/client
        run: bun test --timeout 5000

      - name: Test sdk-next
        if: steps.should-run.outputs.run == 'true'
        working-directory: packages/sdk-next
        # embedded.test.ts excluido: crea BD SQLite real que no funciona en CI efímero
        run: bun test --timeout 5000 ./test/import-boundaries.test.ts

      - name: Test opencode
        if: steps.should-run.outputs.run == 'true'
        working-directory: packages/opencode
        run: bun test --timeout 30000 --only-failures

      - name: Check generated client (codegen validation)
        if: steps.should-run.outputs.run == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        working-directory: packages/client
        run: bun run check:generated

  lint:
    name: Lint (oxlint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        shell: bash
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun lint

  changelog:
    name: Regenerate changelog
    runs-on: ubuntu-latest
    needs: [typecheck, test-desktop, test-app, tests-core, lint]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Verificar AGENTS.md vs workflows activos
        # #53: guard de drift — la sección "Workflows activos" de AGENTS.md
        # debe coincidir con los *.yml de .github/workflows/ (sin red ni
        # permisos extra; pages-build-deployment y *.disabled son casos
        # especiales). Falla el CI si hay drift.
        run: python scripts/check-ci-docs.py

      - name: Regenerate changelog.html + changelog.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python scripts/kanban-sync.py changelog
          if ! git diff --quiet docs/; then
            git config user.name "jarvis"
            git config user.email "bot@jarvis.ai"
            git add docs/changelog.html docs/changelog.json
            git commit -m "docs: auto-regenerate changelog [skip ci]"
            git push origin dev
          fi

name: upstream-report

# Informe semanal de sincronización con upstream (Issue #41).
# SOLO informa: publica el ahead/behind y los commits candidatos como
# issue/comentario. NUNCA mergea nada — la sync se decide en el kanban.
on:
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-report
  cancel-in-progress: true

jobs:
  report:
    name: Generar y publicar informe upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (historia completa)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Añadir remote upstream
        run: git remote add upstream https://github.com/sst/opencode.git

      - name: Generar informe
        run: |
          python scripts/upstream-report.py > /tmp/upstream-report.md
          echo "Informe generado ($(wc -l < /tmp/upstream-report.md) líneas)"

      - name: Identidad del token (diagnóstico)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api user --jq '"Token GH_PAT como: " + .login'

      - name: Garantizar label upstream (best-effort)
        # #51: el GITHUB_TOKEN no puede crear issues ni gestionar labels en este
        # repo (403 con issues:write), y el GH_PAT puede que tampoco gestione
        # labels (404 en /labels). El label es opcional: el informe se publica
        # y se encuentra por título. Si el token lo permite, se crea/actualiza
        # el label (idempotente con --force); si no, se avisa y se continúa.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if gh label create upstream --force --color B60205 \
            --description "Sincronización con upstream (informes semanales)" 2>/dev/null; then
            echo "Label upstream garantizado"
          else
            echo "AVISO: el token no puede gestionar labels — el informe no depende del label (se encuentra por título)"
          fi

      - name: Publicar informe (crear o comentar issue)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TITLE="Informe upstream (semanal)"
          ISSUE=$(gh issue list --search "in:title \"Informe upstream (semanal)\"" --state open \
            --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$ISSUE" ]; then
            gh issue create --title "$TITLE" --body-file /tmp/upstream-report.md
            echo "Issue de informe creado"
          else
            gh issue comment "$ISSUE" --body-file /tmp/upstream-report.md
            echo "Comentario añadido al issue #$ISSUE"
          fi

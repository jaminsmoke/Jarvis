name: test

# Suite nocturna de tests: unit + e2e. Solo corre por schedule o manualmente.
# No bloquea PRs; es informativa. Si se estabiliza, se evaluará hacerla required.
on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC diario
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        shell: bash
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      # Los tests NO se ejecutan desde la raíz: el guard do-not-run-tests-from-root
      # de bunfig.toml lo impide a propósito. Un paso por paquete con working-directory,
      # mismo patrón que ci-quality.yml.
      - name: Run unit tests (schema)
        timeout-minutes: 25
        working-directory: packages/schema
        run: bun test --timeout 30000

      - name: Run unit tests (protocol)
        timeout-minutes: 25
        working-directory: packages/protocol
        run: bun test --timeout 30000

      - name: Run unit tests (core)
        timeout-minutes: 25
        working-directory: packages/core
        run: bun test --timeout 30000

      # server no declara tests: bun test sin archivos *.test.* falla con exit 1
      # en CI (pipefail), así que se omite explícitamente.
      - name: Run unit tests (client)
        timeout-minutes: 25
        working-directory: packages/client
        run: bun test --timeout 5000

      - name: Run unit tests (sdk-next)
        timeout-minutes: 25
        working-directory: packages/sdk-next
        run: bun test --timeout 5000 ./test/import-boundaries.test.ts

      - name: Run unit tests (opencode)
        timeout-minutes: 25
        working-directory: packages/opencode
        run: bun test --timeout 30000

      - name: Run unit tests (codemode)
        timeout-minutes: 25
        working-directory: packages/codemode
        run: bun test --timeout 30000

      - name: Run unit tests (llm)
        timeout-minutes: 25
        working-directory: packages/llm
        run: bun test --timeout 30000

      - name: Run unit tests (tui)
        timeout-minutes: 25
        working-directory: packages/tui
        run: bun test --timeout 30000

      - name: Run unit tests (ui)
        timeout-minutes: 25
        working-directory: packages/ui
        run: bun test --timeout 30000

      - name: Run unit tests (session-ui)
        timeout-minutes: 25
        working-directory: packages/session-ui
        run: bun test --timeout 30000

      - name: Run unit tests (effect-drizzle-sqlite)
        timeout-minutes: 25
        working-directory: packages/effect-drizzle-sqlite
        run: bun test --timeout 30000

      - name: Run unit tests (http-recorder)
        timeout-minutes: 25
        working-directory: packages/http-recorder
        run: bun test --timeout 30000

      - name: Run unit tests (httpapi-codegen)
        timeout-minutes: 25
        working-directory: packages/httpapi-codegen
        run: bun test --timeout 30000

      - name: Run unit tests (app)
        timeout-minutes: 25
        working-directory: packages/app
        run: bun test --conditions=solid --preload ./happydom.ts ./src

      - name: Run unit tests (desktop)
        timeout-minutes: 25
        working-directory: packages/desktop
        run: bun test

      - name: Check generated client
        if: runner.os == 'Linux'
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        if: runner.os == 'Linux'
        working-directory: packages/opencode
        run: bun run test:httpapi

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        shell: bash
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.os }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
